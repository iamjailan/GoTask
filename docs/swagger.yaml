basePath: /
definitions:
  auth.confirmEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  auth.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.registerRequest:
    properties:
      avatar_url:
        type: string
      email:
        maxLength: 255
        type: string
      first_name:
        maxLength: 100
        type: string
      last_name:
        maxLength: 100
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      phone:
        maxLength: 30
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  me.changeEmailRequestDoc:
    properties:
      current_password:
        example: current-password
        type: string
      email:
        example: new@example.com
        type: string
    type: object
  me.changePasswordRequestDoc:
    properties:
      current_password:
        example: current-password
        type: string
      new_password:
        example: new-password
        type: string
    type: object
  me.profileUpdateRequestDoc:
    properties:
      avatar_url:
        example: https://example.com/avatar.png
        type: string
      first_name:
        example: Ada
        type: string
      last_name:
        example: Lovelace
        type: string
      phone:
        example: "+12025550123"
        type: string
    type: object
  response.ErrorData:
    properties:
      error:
        example: unauthorized
        type: string
    type: object
  response.ErrorEnvelope:
    properties:
      data:
        $ref: '#/definitions/response.ErrorData'
      success:
        example: false
        type: boolean
    type: object
  response.SuccessEnvelope:
    properties:
      data: {}
      success:
        example: true
        type: boolean
    type: object
  task.taskRequest:
    properties:
      completed:
        type: boolean
      description:
        maxLength: 5000
        type: string
      due_date:
        type: string
      priority:
        enum:
        - low
        - medium
        - high
        - urgent
        type: string
      status:
        enum:
        - pending
        - in_progress
        - completed
        - archived
        type: string
      title:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - title
    type: object
info:
  contact: {}
  description: REST API for GoTask customer accounts and tasks.
  title: GoTask API
  version: "1.0"
paths:
  /customer/auth/confirm-email:
    post:
      consumes:
      - application/json
      description: Verifies the email code and returns a customer JWT.
      parameters:
      - description: Email verification details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.confirmEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Confirm customer email
      tags:
      - Customer authentication
  /customer/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a verified customer and returns a customer JWT.
      parameters:
      - description: Customer credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Customer login
      tags:
      - Customer authentication
  /customer/auth/register:
    post:
      consumes:
      - application/json
      description: Creates a pending customer registration and sends an email verification
        code.
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.registerRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/response.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Start customer registration
      tags:
      - Customer authentication
  /customer/me:
    delete:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete the authenticated customer
      tags:
      - Customer profile
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get the authenticated customer
      tags:
      - Customer profile
    put:
      consumes:
      - application/json
      parameters:
      - description: Profile details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/me.profileUpdateRequestDoc'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update the authenticated customer profile
      tags:
      - Customer profile
  /customer/me/email:
    put:
      consumes:
      - application/json
      parameters:
      - description: New email and current password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/me.changeEmailRequestDoc'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Change the authenticated customer email
      tags:
      - Customer profile
  /customer/me/password:
    put:
      consumes:
      - application/json
      parameters:
      - description: Current and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/me.changePasswordRequestDoc'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Change the authenticated customer password
      tags:
      - Customer profile
  /customer/tasks:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List tasks
      tags:
      - Customer tasks
    post:
      consumes:
      - application/json
      parameters:
      - description: Task details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/task.taskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Create a task
      tags:
      - Customer tasks
  /customer/tasks/{id}:
    delete:
      parameters:
      - description: Task ID
        example: tsk_123
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Delete a task
      tags:
      - Customer tasks
    get:
      parameters:
      - description: Task ID
        example: tsk_123
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Get a task
      tags:
      - Customer tasks
    put:
      consumes:
      - application/json
      parameters:
      - description: Task ID
        example: tsk_123
        in: path
        name: id
        required: true
        type: string
      - description: Task details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/task.taskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Update a task
      tags:
      - Customer tasks
  /health:
    get:
      description: Reports whether the API server is available.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessEnvelope'
      summary: Check API health
      tags:
      - System
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Supply a customer JWT as `Bearer <token>`.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
